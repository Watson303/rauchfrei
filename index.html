<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16221c;--muted:#5f6d66;--line:#dfe6e2;--acc:#1d8a5a;--acc2:#e6f3ec;--a:#2b78b8;--b:#d4613a;--sos:#d64545;--warm:#fff1e6;--shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.04);color-scheme:light}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}

[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}

.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600}

main{max-width:640px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bottom button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit}
nav.bottom .i{font-size:21px;line-height:1.2}

.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack>*+*{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;font-size:16px;font-weight:600;cursor:pointer;width:100%;font-family:inherit;text-align:center}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--sos)}
.btn.big{padding:14px;font-size:17px}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--acc);font-size:15px;font-weight:600;padding:8px 0;cursor:pointer;font-family:inherit}
.link.danger{color:var(--sos)}
.sos{display:block;width:100%;border:0;border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--sos),#b8326a);color:#fff;font-size:20px;font-weight:700;box-shadow:0 6px 18px rgba(214,69,69,.28);margin-bottom:14px;font-family:inherit;cursor:pointer}
.sos small{display:block;font-weight:500;font-size:13.5px;opacity:.92}
.quote{font-size:16px;font-style:italic;text-align:center;padding:14px 16px}
.quote::before{content:"Spruch des Tages";display:block;font-style:normal;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pgrid{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:14px}

.pcard{border-top:5px solid var(--pc);margin:0}
.ph{display:flex;align-items:center;gap:8px;font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.tag{font-size:11px;background:var(--acc2);color:var(--acc);border-radius:6px;padding:1px 6px;font-weight:700}
.bigt{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpis div{background:var(--acc2);border-radius:10px;padding:8px 4px;text-align:center}
.kpis b{display:block;font-size:16px}
.kpis span{font-size:11.5px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pc,var(--acc));border-radius:6px}
.bar.thick{height:16px;border-radius:9px}
.cheer{background:var(--warm);border-color:transparent}

label{display:block;font-size:14px;font-weight:600;margin:12px 0 0}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;display:inline-block;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--acc)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);height:32px}
label.chk{font-weight:500;display:flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{margin:0;position:relative;font-weight:500}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-size:14px;background:var(--bg)}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));position:relative}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.x{position:absolute;right:6px;top:6px;border:0;background:none;font-size:30px;line-height:1;color:var(--muted);width:44px;height:44px;cursor:pointer}
.sheet h2{padding-right:36px}
.cd{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--sos)}
.reason{background:var(--warm);border-radius:12px;padding:12px;margin:12px 0}
.tip{background:var(--acc2);border-radius:12px;padding:12px;margin:12px 0}
.breathwrap{height:250px;display:flex;align-items:center;justify-content:center}
.circle{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8fdcb3,var(--acc));transform:scale(.42);box-shadow:0 0 40px rgba(29,138,90,.35)}
.bt{font-size:24px;font-weight:700;text-align:center;min-height:34px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:12px auto}
.mem button{aspect-ratio:1;border-radius:12px;border:0;font-size:32px;background:var(--acc);color:transparent;cursor:pointer;transition:background .15s}
.mem button.open,.mem button.done{background:var(--acc2);color:inherit}
.mem button.done{opacity:.55}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.badge{text-align:center;padding:10px 6px;border-radius:12px;background:var(--acc2);font-size:12.5px;font-weight:600}
.badge .e{font-size:30px;display:block;line-height:1.3}
.badge .d{font-weight:400;color:var(--muted);font-size:11.5px}
.badge.off{background:var(--bg);opacity:.45;filter:grayscale(1)}
.hl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hl:last-child{border-bottom:0}
.hl .ic{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--line);font-size:14px;font-weight:700;color:var(--muted)}
.hl.ok .ic{background:var(--acc);color:#fff}
.hl b{display:block}
.entry{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.entry:last-child{border-bottom:0}
.entry .body{flex:1;min-width:0}
.entry .del{background:none;border:0;color:var(--muted);font-size:22px;width:36px;height:36px;cursor:pointer}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;font-weight:600}
.pill.ok{background:var(--acc2);color:var(--acc)}
.pill.no{background:var(--warm);color:var(--b)}
.dayh{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 0;font-weight:700}
.hbar{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.hbar span:first-child{width:118px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{flex:1;margin:0}
.hbar b{width:26px;text-align:right}
.legend{display:flex;gap:14px;font-size:13px;margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
details.card>summary{font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";transform:rotate(90deg);transition:transform .15s;color:var(--muted)}

.rlist{list-style:none;padding:0;margin:8px 0}
.rlist li{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:9px;margin-bottom:6px}
.rlist li span{flex:1}
.rlist button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.msg{min-height:1.4em;margin-top:10px;color:var(--sos);font-size:14.5px}
.msg.ok{color:var(--acc)}
.authbox{max-width:430px;margin:0 auto;padding:28px 16px 40px}
.logo{font-size:52px;text-align:center}
.authbox h1{text-align:center;margin:2px 0 4px;font-size:26px}
.authlinks{display:flex;flex-direction:column;align-items:center;margin-top:16px}
.hint{background:var(--warm);border-radius:12px;padding:12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2622;color:#fff;padding:11px 16px;border-radius:11px;font-size:14.5px;z-index:40;max-width:92vw;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#24563f;padding:7px;border-radius:14px;max-width:380px;margin:12px auto}
.c4 button{aspect-ratio:1;border-radius:50%;border:0;background:var(--bg);padding:0;cursor:pointer;transition:background .2s}
.c4 button:disabled{cursor:default}
.c4 button.a{background:var(--a)}.c4 button.b{background:var(--b)}
.c4 button.win{box-shadow:0 0 0 3px #ffd84a inset}
.c4 button.last{box-shadow:0 0 0 2px rgba(255,255,255,.75) inset}
.dbox{box-shadow:none;margin-bottom:10px;padding:12px 14px}
.dbox .two .btn{padding:9px 10px;font-size:15px}
.rx{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:260px;border:0;border-radius:18px;margin-top:12px;font-size:26px;font-weight:800;color:#fff;font-family:inherit;cursor:pointer;background:#5f6d66;touch-action:manipulation}
.rx small{font-size:14px;font-weight:500;margin-top:8px;opacity:.9}
.rx.wait{background:var(--sos)}.rx.go{background:#21a35f}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:270px;margin:10px auto}
.wgrid div{aspect-ratio:1;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.wg{background:#2f9a5a!important;border-color:#2f9a5a!important;color:#fff!important}
.wy{background:#d4a21f!important;border-color:#d4a21f!important;color:#fff!important}
.wx{background:#7b8580!important;border-color:#7b8580!important;color:#fff!important}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.kb div{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:36px;height:48px;border-radius:7px;border:0;background:var(--line);color:var(--ink);font-weight:700;font-size:15px;padding:0;font-family:inherit;touch-action:manipulation}
.kb button.wide{max-width:54px;flex:1.6;font-size:13px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:360px;margin:12px auto}
.ngrid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;font-family:inherit;touch-action:manipulation}
.ngrid button.done{background:var(--acc2);color:var(--muted);opacity:.5}
.ngrid button.bad{background:var(--sos);color:#fff}
.nim{margin:14px 0}
.nrow{display:flex;justify-content:center;gap:4px;margin:6px 0;min-height:46px}
.nrow button{border:2px solid transparent;background:var(--acc2);border-radius:10px;font-size:24px;width:42px;height:46px;padding:0;cursor:pointer;touch-action:manipulation}
.nrow button.sel{border-color:var(--sos);background:var(--warm);opacity:.6}
.nrow span{width:42px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:24px}
</style>
</head>

<script>

const TRIGGERS = ['Kaffee','Nach dem Essen','Stress','Alkohol','Langeweile','Pause','Andere rauchen','Auto fahren','Ärger','Müdigkeit','Sonstiges'];
/* ============ Quiz-Fragen ============ */
// c = Index der richtigen Antwort, x = kurze Erklärung
const QUIZ_H = [
 {q:'Wie viele chemische Stoffe enthält Tabakrauch ungefähr?',a:['500','Über 7.000','Etwa 50','Über 100.000'],c:1,x:'Im Tabakrauch stecken über 7.000 Stoffe, viele davon giftig.'},

/* ============ Verschlüsselung ============ */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8000));return btoa(s)}
function ub64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function deriveKey(user,pw,salt,it){
  const km=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(salt),iterations:it||ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function encryptState(key,salt,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {app:'rauchfrei',v:1,salt,it:ITER,iv:b64(iv),mod:Date.now(),data:b64(new Uint8Array(ct))};
}
async function decryptBlob(key,blob){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(blob.iv)},key,ub64(blob.data));
  return JSON.parse(dec.decode(pt));
}
async function saveKey(key,salt){const raw=await crypto.subtle.exportKey('raw',key);lsSet(LS.key,JSON.stringify({s:salt,k:b64(new Uint8Array(raw))}))}
function getBlob(){try{const b=JSON.parse(lsGet(LS.blob)||'null');return b&&b.data&&b.salt?b:null}catch(e){return null}}
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));

function normalize(st){
  st.people=st.people||{};
  ['a','b'].forEach(k=>{st.people[k]=Object.assign(person(k==='a'?'Person 1':'Person 2'),st.people[k]||{});if(!Array.isArray(st.people[k].reasons))st.people[k].reasons=[]});
  st.goal=st.goal||{name:'Gemeinsames Ziel',amount:1000,u:0};
  ['cravings','cheers','events','quiz','duels','matches','moves','deleted'].forEach(f=>{if(!Array.isArray(st[f]))st[f]=[]});
  st.seen=st.seen||{};st.seen.a=st.seen.a||[];st.seen.b=st.seen.b||[];
  return st;
}
function newer(x,y){if(!x)return y;if(!y)return x;return (y.u||0)>(x.u||0)?y:x}
function unionById(a,b,del){const m=new Map();[...(a||[]),...(b||[])].forEach(o=>{if(o&&o.id&&!del.has(o.id))m.set(o.id,o)});return [...m.values()].sort((x,y)=>x.t-y.t)}
function merge(L,R){
  L=normalize(L);R=normalize(R);
  const del=new Set([...L.deleted,...R.deleted]);
  return {v:1,
    people:{a:newer(L.people.a,R.people.a),b:newer(L.people.b,R.people.b)},
    goal:newer(L.goal,R.goal),
    cravings:unionById(L.cravings,R.cravings,del),
    quiz:unionById(L.quiz,R.quiz,del),
    duels:unionById(L.duels,R.duels,del),
    matches:unionById(L.matches,R.matches,del),
    moves:unionById(L.moves,R.moves,del),
    cheers:unionById(L.cheers,R.cheers,del),
    events:unionById(L.events,R.events,del),
    seen:{a:[...new Set([...L.seen.a,...R.seen.a])],b:[...new Set([...L.seen.b,...R.seen.b])]},
    deleted:[...del]};
}

function calc(p){
  const ms=Math.max(0,Date.now()-p.quit), days=ms/D;
  const cigs=Math.floor(days*(p.perDay||0));
  const money=p.packSize>0?cigs*(p.packPrice||0)/p.packSize:0;
  return {ms,days,cigs,money,future:p.quit>Date.now()};
}
function ctx(k){
  const st=S.state, cr=st.cravings.filter(c=>c.p===k);
  return Object.assign(calc(st.people[k]),{
    resisted:cr.filter(c=>c.resisted).length, diary:cr.length,
    breaths:st.events.filter(e=>e.p===k&&e.type==='breath').length,
    games:st.events.filter(e=>e.p===k&&e.type==='game').length+st.duels.filter(x=>x.p===k&&x.g==='mem'&&x.done).length,
    cheers:st.cheers.filter(c=>c.from===k).length,
    quizPlays:st.quiz.filter(q=>q.p===k).length, quizPerfect:st.quiz.filter(q=>q.p===k&&q.score>=5).length, quizWins:quizStats()[k],
    duelPlays:st.quiz.filter(q=>q.p===k).length+st.duels.filter(x=>x.p===k).length, c4Wins:c4Stats()[k]+nimStats()[k]});
}

  async api(url,opt){

    if(r.status===401){this.set({token:null,exp:0});throw new Error('Google-Anmeldung abgelaufen – tippe auf ☁️')}

const altKeys=new Map(); // frühere Schlüssel dieser Sitzung (nach dem Zusammenführen)
let syncT=null, driveConflict=null;
async function resolveConflict(u,p){
  const remote=driveConflict; if(!remote) return;
  const key=await deriveKey(u,p,remote.salt,remote.it);
  const rs=await decryptBlob(key,remote); // wirft bei falschen Zugangsdaten
  const kept=!!lsGet(LS.key);
  altKeys.set(S.salt,S.key);
  S.state=merge(rs,S.state); S.key=key; S.salt=remote.salt; driveConflict=null;
  await persist(); if(kept) await saveKey(key,remote.salt);
  closeAll(); render(); await sync(false);
  toast('Zusammengeführt ✓ Ab jetzt gelten die Zugangsdaten aus Google Drive.',5000);
}
function scheduleSync(fast){if(!Drive.on()||!Drive.valid())return updateSyncBtn();clearTimeout(syncT);syncT=setTimeout(()=>sync(false),fast?300:2500)}
async function sync(interactive,opts){
  opts=opts||{};
  if(!S||Drive.busy) return;
  if(!Drive.on()&&!interactive) return;
  Drive.busy=true; Drive.status='Abgleich läuft …'; updateSyncBtn();
  try{
    await Drive.auth(interactive);
    if(interactive||!Drive.cfg().email) await Drive.account();
    // ALLE Dateien einlesen und zusammenführen, dann in eine einzige schreiben
    const files=await Drive.listFiles(), done=[];
    for(const f of files){
      if(opts.pushOnly){done.push(f.id);continue}
      const remote=await Drive.get(f.id);
      if(!remote||remote.app!=='rauchfrei'||!remote.data) continue;
      const key=remote.salt===S.salt?S.key:altKeys.get(remote.salt);
      let rs=null; if(key){try{rs=await decryptBlob(key,remote)}catch(e){}}
      if(!rs){driveConflict=remote;throw Object.assign(new Error('Google Drive hat einen anderen Datenstand. Bitte unter Mehr → Google Drive zusammenführen.'),{hard:true})}
      S.state=merge(S.state,rs); done.push(f.id);
    }
    driveConflict=null;
    const blob=await encryptState(S.key,S.salt,S.state);
    lsSet(LS.blob,JSON.stringify(blob));
    const id=await Drive.upload(blob,done[0]||null);
    for(const fid of done) if(fid!==id) await Drive.remove(fid); // doppelte Dateien aufräumen (Inhalt ist schon übernommen)
    Drive.set({fileId:id,last:Date.now()}); Drive.status='Abgeglichen um '+fmtTime(Date.now());
    if(interactive) toast('Mit Google Drive abgeglichen ✓');
    render();
    const top=M.stack[M.stack.length-1]; if(top&&top.refresh&&top.refresh()) showTop(); // offene Duell-Ansicht auffrischen
  }catch(e){Drive.status=e.message; if(interactive||e.hard) toast(e.message,6000); updateSyncBtn(); if(ui.tab==='more') render();}
  finally{Drive.busy=false;updateSyncBtn()}
}
function updateSyncBtn(){
  const b=$('#syncbtn'); if(!b) return;
  b.hidden=!Drive.on();
  b.classList.toggle('err',Drive.on()&&(!Drive.valid()||!!driveConflict));
  b.textContent=Drive.busy?'⏳':(Drive.valid()&&!driveConflict?'☁️ ✓':'☁️ !');
  b.title=Drive.status||'';
}

async function boot(){
  if(!(window.crypto&&crypto.subtle)){document.body.innerHTML='<div class="authbox"><h1>Rauchfrei</h1><p>Dieser Browser kann die Verschlüsselung nicht nutzen. Bitte die App über https öffnen (z. B. GitHub Pages).</p></div>';return}

function breathStart(){
  const seq=[];for(let r=0;r<6;r++)seq.push(['Einatmen',4,1],['Halten',4,1],['Ausatmen',6,.42]);
  const bc=$('#bc'),bt=$('#bt'),br=$('#br'),bs=$('#bstart');bs.hidden=true;
  let i=-1,left=0;
  const next=()=>{i++;if(i>=seq.length){clearTimers();bt.textContent='Gut gemacht! 🌿';br.textContent='Wie fühlst du dich jetzt?';bs.hidden=false;bs.textContent='Nochmal';logEvent('breath');return}
    const [l,s,sc]=seq[i];left=s;bc.style.transition=`transform ${s}s ease-in-out`;bc.style.transform=`scale(${sc})`;bt.textContent=`${l} … ${left}`;br.textContent=`Runde ${Math.floor(i/3)+1} von 6`};
  next();
  M.timers.push(setInterval(()=>{left--;if(left<=0)next();else bt.textContent=`${seq[i][0]} … ${left}`},1000));
}

let G=null;
function gameNew(day){const em=['🍎','🌿','🌊','🌞','🚲','⭐','🎈','🦋'];const deck=day?sshuffle([...em,...em],seedRng('rf-mem-'+day)):shuffle([...em,...em]);G={deck:deck.map(e=>({e,open:false,done:false})),first:-1,lock:false,moves:0,pairs:0,start:0,duel:day||null,finished:false}}
function gameModal(day){gameNew(day);return {html:()=>G.duel?`<h2>🧩 Memory-Duell</h2><p class="small muted">Heute für euch beide dasselbe Feld. Weniger Züge gewinnt, bei Gleichstand die Zeit. Die Uhr läuft ab der ersten Karte.</p><div class="mem" id="mem"></div><div class="center small" id="gstat"></div><div id="gagain"></div>`:`<h2>🧩 Memory</h2><p class="small muted">Finde alle Paare. Das lenkt ab, bis das Verlangen vorbei ist.</p><div class="mem" id="mem"></div><div class="center small" id="gstat"></div><div id="gagain"></div>`,init:renderMem}}
function renderMem(){
  const m=$('#mem');if(!m)return;
  m.innerHTML=G.deck.map((c,i)=>`<button class="${c.done?'done':c.open?'open':''}" data-act="flip" data-i="${i}" aria-label="Karte">${c.e}</button>`).join('');
  $('#gstat').textContent=`Züge: ${G.moves} · Paare: ${G.pairs} von 8`;
}
function flip(i){
  const c=G.deck[i];if(G.lock||c.open||c.done||G.finished)return;
  if(!G.start)G.start=Date.now();
  c.open=true;
  if(G.first<0){G.first=i;renderMem();return}
  G.moves++;const f=G.deck[G.first];
  if(f.e===c.e){f.done=c.done=true;G.pairs++;G.first=-1;renderMem();
    if(G.pairs===8&&G.duel){memDuelEnd();return}
    if(G.pairs===8){const s=Math.round((Date.now()-G.start)/1000);$('#gstat').textContent=`Geschafft in ${G.moves} Zügen und ${s} Sekunden! 🎉`;$('#gagain').innerHTML='<button class="btn primary" data-act="gameAgain" style="margin-top:10px">Nochmal spielen</button>';logEvent('game')}
  }else{G.lock=true;renderMem();M.timers.push(setTimeout(()=>{f.open=c.open=false;G.first=-1;G.lock=false;renderMem()},850))}
}

/* ============ Quiz-Duell ============ */
function seedRng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function sshuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const dayKey=(t)=>{const d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayLabel=k=>{const [y,m,d]=k.split('-');return d+'.'+m+'.'};
const QUIZ_N=5, QUIZ_SEC=15;
function quizSet(day,practice){
  const r=practice?Math.random:seedRng('rf-quiz-'+day);
  const qs=sshuffle([...sshuffle(QUIZ_H,r).slice(0,2),...sshuffle(QUIZ_G,r).slice(0,3)],r);
  return qs.map(q=>{const order=sshuffle(q.a.map((t,i)=>i),r);return {q:q.q,a:order.map(i=>q.a[i]),c:order.indexOf(q.c),x:q.x||''}});
}
function quizResult(day,k){return S.state.quiz.find(q=>q.day===day&&q.p===k)}
function duelWinner(ra,rb){if(!ra||!rb)return null;if(ra.score!==rb.score)return ra.score>rb.score?'a':'b';if(ra.ms!==rb.ms)return ra.ms<rb.ms?'a':'b';return 'draw'}
function quizStats(){
  const days=[...new Set(S.state.quiz.map(q=>q.day))].sort().reverse(), res={a:0,b:0,draw:0,list:[]};
  days.forEach(d=>{const ra=quizResult(d,'a'),rb=quizResult(d,'b'),w=duelWinner(ra,rb);if(w)res[w]++;res.list.push({d,ra,rb,w})});
  return res;
}
const fmtSec=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
let Q=null;
function quizModal(){
  return {refresh:()=>!Q,
    html(){
      const k=me(),o=other(k),d=dayKey();
      if(!Q){ // Übersicht
        const mine=quizResult(d,k),theirs=quizResult(d,o),st=quizStats();
        return `<h2>🧠 Quiz-Duell</h2>
         <p class="small muted">Jeden Tag gibt es ${QUIZ_N} neue Fragen – für euch beide dieselben. Pro Frage habt ihr ${QUIZ_SEC} Sekunden. Wer mehr richtig hat, gewinnt; bei Gleichstand entscheidet die Zeit.</p>
         <div class="kpis"><div style="--pc:var(--a)"><b style="color:var(--a)">${st.a}</b><span>Siege ${esc(P('a').name)}</span></div><div><b>${st.draw}</b><span>Unentschieden</span></div><div><b style="color:var(--b)">${st.b}</b><span>Siege ${esc(P('b').name)}</span></div></div>
         <h3>Heute (${dayLabel(d)})</h3>
         <div class="small">${esc(P(k).name)}: <b>${mine?mine.score+' von '+QUIZ_N+' · '+fmtSec(mine.ms):'noch nicht gespielt'}</b></div>
         <div class="small">${esc(P(o).name)}: <b>${theirs?theirs.score+' von '+QUIZ_N+' · '+fmtSec(theirs.ms):'noch nicht gespielt'}</b></div>
         <div class="stack" style="margin-top:14px">${mine?'':`<button class="btn primary big" data-act="quizStart">Duell starten</button>`}
          <button class="btn ghost" data-act="quizPractice">Übungsrunde (zählt nicht)</button></div>
         ${st.list.length?`<h3>Letzte Duelle</h3>${st.list.slice(0,10).map(x=>`<div class="hbar"><span>${dayLabel(x.d)}</span><span style="flex:1">${x.ra?x.ra.score:'–'} : ${x.rb?x.rb.score:'–'}</span><b style="width:auto">${x.w?(x.w==='draw'?'🤝':'🏆 '+esc(P(x.w).name)):'offen'}</b></div>`).join('')}`:''}
         ${Drive.on()?'':`<p class="small muted" style="margin-top:12px">Tipp: Mit Google Drive seht ihr die Ergebnisse des anderen auf eurem eigenen Handy.</p>`}`;
      }
      if(Q.i>=Q.set.length){ // Ende
        const theirs=Q.practice?null:quizResult(Q.day,o);
        let verdict='';
        if(theirs){const w=duelWinner(k==='a'?Q.res:theirs,k==='a'?theirs:Q.res);verdict=w==='draw'?'Unentschieden! 🤝':w===k?'Du gewinnst heute! 🏆':`${esc(P(o).name)} gewinnt heute – morgen gibt's Revanche!`}
        else if(!Q.practice) verdict=`Jetzt ist ${esc(P(o).name)} dran!`;
        return `<h2>${Q.practice?'Übungsrunde':'Quiz-Duell'} beendet</h2>

const lower=(f)=>(a,b)=>{if(!!a.done!==!!b.done)return a.done?'a':'b';if(!a.done)return 'draw';for(const k of f){if(a[k]!==b[k])return a[k]<b[k]?'a':'b'}return 'draw'};

    fmt:r=>`${r.score} richtig${r.wrong?' · '+r.wrong+' falsch':''}`,
    win:(a,b)=>a.score!==b.score?(a.score>b.score?'a':'b'):a.wrong!==b.wrong?(a.wrong<b.wrong?'a':'b'):'draw'},
  mem:{t:'🧩 Memory',d:'Dasselbe Feld für beide. Weniger Züge gewinnt, dann die Zeit.',
    fmt:r=>r.done?`${r.moves} Züge · ${fmtSec(r.ms)}`:'abgebrochen', win:lower(['moves','ms'])},
  react:{t:'⚡ Reaktion',d:'5× tippen, sobald es grün wird. Der schnellere Durchschnitt gewinnt.',
    fmt:r=>`Ø ${num(r.ms)} ms${r.early?' · '+r.early+'× zu früh':''}`, win:lower(['ms'])},
  word:{t:'🔤 Wort-Raten',d:'Wort des Tages mit 5 Buchstaben, höchstens 6 Versuche. Weniger Versuche gewinnt, dann die Zeit.',
    fmt:r=>r.done?`${r.tries}. Versuch · ${fmtSec(r.ms)}`:'nicht erraten', win:lower(['tries','ms'])},
  num:{t:'🎯 Zahlenjagd',d:'Tippe 1 bis 25 der Reihe nach an. Jeder Fehler kostet 1 Sekunde.',
    fmt:r=>r.done?`${fmtSec(r.ms)}${r.errors?' (inkl. '+r.errors+' Fehler)':''}`:'abgebrochen', win:lower(['ms'])}
};
const DAILY=['quiz','math','mem','react','word','num'];
function duelResult(g,day,k){return S.state.duels.find(x=>x.g===g&&x.day===day&&x.p===k)}
function duelWin(g,day){const ra=duelResult(g,day,'a'),rb=duelResult(g,day,'b');return ra&&rb?DUELS[g].win(ra,rb):null}
function duelStats(g){const res={a:0,b:0,draw:0};new Set(S.state.duels.filter(x=>x.g===g).map(x=>x.day)).forEach(d=>{const w=duelWin(g,d);if(w)res[w]++});return res}

/* --- Kopfrechnen --- */
const MATH_SEC=60;
function mathTasks(r){
  const out=[];
  for(let n=0;n<150;n++){
    const ty=Math.floor(r()*4); let q,ans;
    if(ty===0){const a=10+Math.floor(r()*90),b=10+Math.floor(r()*90);q=`${a} + ${b}`;ans=a+b}
    else if(ty===1){const a=20+Math.floor(r()*80),b=1+Math.floor(r()*(a-1));q=`${a} − ${b}`;ans=a-b}
    else if(ty===2){const a=2+Math.floor(r()*11),b=2+Math.floor(r()*11);q=`${a} × ${b}`;ans=a*b}
    else {const b=2+Math.floor(r()*9),c=2+Math.floor(r()*11);q=`${b*c} ÷ ${b}`;ans=c}
    const offs=[-10,-2,-1,1,2,10,-3,3], opts=new Set([ans]);
    while(opts.size<4){const o=ans+offs[Math.floor(r()*offs.length)];if(o>=0)opts.add(o)}
    out.push({q,ans,o:sshuffle([...opts],r)});
  }
  return out;
}
let MX=null;
function mathBegin(practice){
  const d=dayKey(); if(!practice&&played('math',d,me())) return alreadyToast('math');
  MX={day:d,practice,tasks:mathTasks(practice?Math.random:seedRng('rf-math-'+d)),i:0,score:0,wrong:0,start:0,end:false,last:null};
  pushModal(mathModal());
}
function mathModal(){return {game:true,
  html(){

    return `<div class="row small muted" style="padding-right:40px"><span>${MX.practice?'Übung · ':''}<span id="mleft">${MATH_SEC}</span> s</span><span>${MX.score} richtig</span></div>
      <div class="bar" style="margin:8px 0 18px"><i id="mbar" style="width:100%"></i></div>
      <div class="cd" style="color:var(--ink);font-size:40px">${t.q}</div>
      <div class="center small" style="min-height:1.5em;color:${MX.last===false?'var(--sos)':'var(--acc)'}">${MX.last===null?'':MX.last?'✓ richtig':'✗ falsch'}</div>
      <div class="two" style="margin-top:8px">${t.o.map(v=>`<button class="btn big" style="font-size:22px" data-act="mathAns" data-v="${v}">${v}</button>`).join('')}</div>`;

      if(left<=0) mathEnd(true)};
    tick(); M.timers.push(setInterval(tick,100));

}}
function mathAns(v){

function wEval(g,s){const res=Array(5).fill('wx'),cnt={};for(let i=0;i<5;i++){if(g[i]===s[i])res[i]='wg';else cnt[s[i]]=(cnt[s[i]]||0)+1}
  for(let i=0;i<5;i++)if(res[i]!=='wg'&&cnt[g[i]]>0){res[i]='wy';cnt[g[i]]--}return res}
function wordModal(){return {game:true,

    const ks={};let rows='';
    for(let r=0;r<6;r++){
      const g=WX.guesses[r], ev=g?wEval(g,WX.sol):null, w=g||(r===WX.guesses.length?WX.cur:'');
      for(let i=0;i<5;i++){const ch=w[i]||'';rows+=`<div class="${ev?ev[i]:''}">${ch}</div>`;if(ev){const rank={wx:1,wy:2,wg:3};if(!ks[ch]||rank[ev[i]]>rank[ks[ch]])ks[ch]=ev[i]}}

function wKey(k){

const matchesOf=g=>S.state.matches.filter(m=>(m.g||'c4')===g);
function lastMatch(g){const ms=matchesOf(g);return ms.length?ms.reduce((x,y)=>y.t>x.t?y:x):null}
function movesOf(m){return S.state.moves.filter(x=>x.m===m.id).sort((x,y)=>x.n-y.n||x.t-y.t)}
function applyResign(b,mv){if(!b.winner&&!b.draw){const r=mv.find(x=>x.resign);if(r){b.resign=r.p;b.winner=other(r.p)}}b.over=!!b.winner||b.draw;return b}
function turnPoll(){if(Drive.on()) M.timers.push(setInterval(()=>{if(Drive.valid()&&!document.hidden)sync(false)},8000))}
function newMatch(g){
  const last=lastMatch(g), starter=last?other(last.starter):me();
  S.state.matches.push({id:uid(),g,t:Date.now(),starter}); commit(); scheduleSync(true); NSEL=null; showTop();
  toast(starter===me()?'Neues Spiel – du fängst an!':`Neues Spiel – ${P(starter).name} fängt an.`);
}
function resignMatch(g){

function matchStats(g,board){const res={a:0,b:0,draw:0};matchesOf(g).forEach(m=>{const b=board(m);if(b.winner)res[b.winner]++;else if(b.draw)res.draw++});return res}
function matchStatus(b,solo,winTxt){
  const k=me(),o=other(k);
  if(b.winner) return b.resign?`${esc(P(b.resign).name)} hat aufgegeben – ${esc(P(b.winner).name)} gewinnt 🏆`:(b.winner===k?'Du hast gewonnen! 🏆':`${esc(P(b.winner).name)} gewinnt 🏆`)+(winTxt?'<br><span class="small muted">'+winTxt+'</span>':'');
  if(b.draw) return 'Unentschieden 🤝';

/* Vier gewinnt */
function c4Check(g,col){
  const row=g[col].length-1,p=g[col][row],at=(c,r)=>c>=0&&c<7&&r>=0?g[c][r]:undefined;
  for(const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]){
    const cells=[[col,row]];
    for(const s of [1,-1]){let c=col+dc*s,r=row+dr*s;while(at(c,r)===p){cells.push([c,r]);c+=dc*s;r+=dr*s}}
    if(cells.length>=4) return cells.map(x=>x.join(','));
  }
  return null;
}
function c4Board(m){
  const grid=[[],[],[],[],[],[],[]], mv=movesOf(m);
  let turn=m.starter,winner=null,line=[],n=0,last=null;
  for(const x of mv){
    if(x.resign||x.n!==n||x.p!==turn||!(x.col>=0&&x.col<7)||grid[x.col].length>=6) continue;
    grid[x.col].push(x.p); n++; last=x.col+','+(grid[x.col].length-1);
    const w=c4Check(grid,x.col); if(w){winner=x.p;line=w;break}
    turn=other(turn);
  }
  return applyResign({grid,turn,winner,line,n,last,draw:!winner&&n>=42},mv);
}
const c4Stats=()=>matchStats('c4',c4Board);
function c4Modal(){return {refresh:()=>true,
  html(){
    const k=me(),m=lastMatch('c4'),solo=!Drive.on(),head=matchHead('🔴 Vier gewinnt',c4Stats());
    if(!m) return head+`<p class="small muted center">Abwechselnd einen Stein einwerfen. Wer zuerst vier in einer Reihe hat – waagerecht, senkrecht oder schräg – gewinnt.</p><button class="btn primary big" data-act="newMatch" data-g="c4">Neues Spiel starten</button>`;
    const b=c4Board(m), can=!b.over&&(solo||b.turn===k);
    let cells='';
    for(let r=5;r>=0;r--)for(let c=0;c<7;c++){const p=b.grid[c][r]||'',key=c+','+r;
      cells+=`<button class="${p}${b.line.includes(key)?' win':''}${key===b.last&&!b.over?' last':''}" data-act="c4Drop" data-c="${c}" ${can&&b.grid[c].length<6?'':'disabled'} aria-label="Spalte ${c+1}"></button>`}
    return head+`<p class="center" style="margin:6px 0 0"><span class="dot" style="display:inline-block;--pc:var(--${b.over?(b.winner||'acc'):b.turn})"></span> ${matchStatus(b,solo)}</p>
      <div class="c4">${cells}</div>
      ${b.over?'<button class="btn primary" data-act="newMatch" data-g="c4">Neues Spiel</button>':'<button class="btn ghost danger" data-act="resign" data-g="c4">Aufgeben</button>'}${soloNote(solo)}`;
  },
  init:turnPoll
}}
function c4Drop(col){
  const m=lastMatch('c4'); if(!m) return; const b=c4Board(m), solo=!Drive.on();
  if(b.over||(!solo&&b.turn!==me())||b.grid[col].length>=6) return;
  S.state.moves.push({id:uid(),m:m.id,n:b.n,p:b.turn,col,t:Date.now()});
  commit(); scheduleSync(true); showTop();
}

/* Zigaretten-Duell (Nim): Wer die letzte Zigarette nehmen muss, verliert */
const NIM_ROWS=[1,3,5,7];
let NSEL=null;
function nimBoard(m){
  const heaps=[...NIM_ROWS], mv=movesOf(m);
  let turn=m.starter,winner=null,n=0,last=null;
  for(const x of mv){
    if(x.resign||x.n!==n||x.p!==turn||!(x.row>=0&&x.row<4)||!(x.cnt>=1&&x.cnt<=heaps[x.row])) continue;
    heaps[x.row]-=x.cnt; n++; last=x;
    if(heaps.every(h=>h===0)){winner=other(x.p);break}
    turn=other(turn);
  }
  return applyResign({heaps,turn,winner,n,last,draw:false},mv);
}
const nimStats=()=>matchStats('nim',nimBoard);
function nimModal(){return {refresh:()=>!NSEL,
  html(){
    const k=me(),m=lastMatch('nim'),solo=!Drive.on(),head=matchHead('🚬 Zigaretten-Duell',nimStats());
    const rules='Ihr nehmt abwechselnd Zigaretten weg – beliebig viele, aber immer nur aus <b>einer</b> Reihe. Wer die <b>letzte</b> Zigarette nehmen muss, verliert.';
    if(!m) return head+`<p class="small muted center">${rules}</p><button class="btn primary big" data-act="newMatch" data-g="nim">Neues Spiel starten</button>`;
    const b=nimBoard(m), can=!b.over&&(solo||b.turn===k), sel=NSEL&&NSEL.m===m.id?NSEL:null;
    const rows=b.heaps.map((h,r)=>`<div class="nrow">${[...Array(NIM_ROWS[r])].map((_,i)=>i<h?`<button class="${sel&&sel.row===r&&i>=sel.from?'sel':''}" data-act="nimPick" data-r="${r}" data-i="${i}" ${can?'':'disabled'}>🚬</button>`:'<span>·</span>').join('')}</div>`).join('');
    const lastTxt=b.last&&!b.over?`<p class="small muted center">${esc(P(b.last.p).name)} hat zuletzt ${b.last.cnt} aus Reihe ${b.last.row+1} genommen.</p>`:'';
    const winTxt=b.winner&&!b.resign?`${esc(P(other(b.winner)).name)} musste die letzte nehmen.`:'';
    return head+`<p class="center" style="margin:6px 0 0"><span class="dot" style="display:inline-block;--pc:var(--${b.over?b.winner:b.turn})"></span> ${matchStatus(b,solo,winTxt)}</p>${lastTxt}
      <div class="nim">${rows}</div>
      ${b.over?'<button class="btn primary" data-act="newMatch" data-g="nim">Neues Spiel</button>'
        :sel?`<button class="btn primary" data-act="nimTake">${b.heaps[sel.row]-sel.from} ${b.heaps[sel.row]-sel.from===1?'Zigarette':'Zigaretten'} wegnehmen</button><button class="btn ghost" style="margin-top:8px" data-act="nimCancel">Auswahl aufheben</button>`
        :`<p class="small muted center">${can?'Tippe eine Zigarette an – sie und alle rechts daneben werden ausgewählt.':''}</p><button class="btn ghost danger" data-act="resign" data-g="nim">Aufgeben</button>`}
      <details style="margin-top:10px"><summary class="small muted">Spielregeln</summary><p class="small muted">${rules}</p></details>${soloNote(solo)}`;
  },
  init:turnPoll
}}
function nimTake(){
  const m=lastMatch('nim'); if(!m||!NSEL) return; const b=nimBoard(m), solo=!Drive.on(), cnt=b.heaps[NSEL.row]-NSEL.from;
  if(b.over||(!solo&&b.turn!==me())||cnt<1){NSEL=null;return showTop()}
  S.state.moves.push({id:uid(),m:m.id,n:b.n,p:b.turn,row:NSEL.row,cnt,t:Date.now()});
  NSEL=null; commit(); scheduleSync(true); showTop();
}

  a.download='rauchfrei-sicherung-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);

async function importIntoSession(j){
  try{

      pushModal(credsModal('Sicherung öffnen','Diese Sicherung wurde mit anderen Zugangsdaten gemacht. Bitte die damaligen Zugangsdaten eingeben.',async(u,p)=>{

        S.state=merge(S.state,st);closeAll();await commit();toast('Sicherung eingespielt ✓')}));

    const salt=newSalt(),key=await deriveKey(u,p,salt,ITER);
    lsSet(LS.me,fd.get('me')==='b'?'b':'a');
    S={key,salt,state:newState(String(fd.get('na')).trim()||'Person 1',String(fd.get('nb')).trim()||'Person 2')};
    await persist();
    if(fd.get('keep'))await saveKey(key,salt);else lsDel(LS.key);
    startApp(key,salt,S.state);
    ui.tab='more';ui.open='settings';render();
    toast('Eingerichtet! Trag jetzt eure Angaben ein.',4000);
  },
  entry(f,fd){
    const t=fromLocalInput(fd.get('t'));
    S.state.cravings.push({id:uid(),p:fd.get('p')==='b'?'b':'a',t:isFinite(t)?t:Date.now(),i:+fd.get('i')||3,trigger:fd.get('tr')||'',note:String(fd.get('note')||'').trim(),resisted:fd.get('res')==='1'});
    commit();toast(fd.get('res')==='1'?'Eingetragen – stark! 💪':'Eingetragen. Weiter geht\'s! 🌱');
  },
  person(f,fd){
    const k=f.dataset.k,p=P(k),q=fromLocalInput(fd.get('quit'));
    p.name=String(fd.get('name')).trim()||p.name; if(isFinite(q))p.quit=q;
    p.perDay=Math.max(0,pnum(fd.get('perDay')));p.packPrice=Math.max(0,pnum(fd.get('packPrice')));p.packSize=Math.max(1,Math.round(pnum(fd.get('packSize'))||20));
    p.set=true;p.u=Date.now();ui.open='settings';commit();toast('Gespeichert ✓');
  },
  goal(f,fd){S.state.goal={name:String(fd.get('name')).trim()||'Sparziel',amount:Math.max(1,pnum(fd.get('amount'))),u:Date.now()};ui.open='goal';commit();toast('Sparziel gespeichert ✓')},
  reason(f,fd){const r=String(fd.get('r')).trim();if(!r)return;const p=P(me());p.reasons.push(r);p.u=Date.now();ui.open='reasons';commit()},
  cheer(f,fd){const t=String(fd.get('t')).trim();if(!t)return;sendCheer(t);closeAll()},
  cid(f,fd){Drive.set({cid:String(fd.get('cid')).trim()});ui.open='drive';render();toast('Client-ID gespeichert')},
  cidModal(f,fd){const c=String(fd.get('cid')).trim();if(!c)return;Drive.set({cid:c});const m=M.stack[M.stack.length-1];popModal();if(m&&m.after)m.after()},
  async creds(f,fd){const m=M.stack[M.stack.length-1];try{await m.onOk(fd.get('u'),fd.get('p'))}catch(e){const c=$('#cmsg');if(c)c.textContent='Benutzername oder Passwort falsch.'}},
  async pw(f,fd){
    const u=String(fd.get('u')).trim(),p=String(fd.get('p'));
    if(p.length<10){toast('Das Passwort sollte mindestens 10 Zeichen haben.');return}
    if(p!==fd.get('p2')){toast('Die beiden Passwörter sind nicht gleich.');return}
    if(!confirm('Zugang wirklich ändern? Auf dem anderen Handy müsst ihr euch danach mit den neuen Daten anmelden.'))return;
    if(Drive.on()&&Drive.valid()){await sync(false)}
    const salt=newSalt(),key=await deriveKey(u,p,salt,ITER);
    S.key=key;S.salt=salt;await persist();
    if(lsGet(LS.key))await saveKey(key,salt);
    if(Drive.on()&&Drive.valid())await sync(false,{pushOnly:true});
    f.reset();toast('Zugang geändert ✓ Auf dem anderen Handy: „Neueste Daten aus Google Drive holen“ und neu anmelden.',7000);
  }
};
document.addEventListener('submit',e=>{const f=e.target,h=FORMS[f.dataset.form];if(!h)return;e.preventDefault();h(f,new FormData(f))});

/* ============ Laufzeit ============ */
setInterval(()=>{if(S&&ui.tab==='start'&&!document.hidden&&$('#modal').hidden)render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S){if(ui.tab==='start'&&$('#modal').hidden)render();if(Drive.on()&&Drive.valid())sync(false)}});
/* ============ Updates ============ */
let swReg=null, pendingReload=false;
function busyNow(){const a=document.activeElement;return !$('#modal').hidden||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='range')}
function doReload(){try{sessionStorage.setItem('rf_updated','1')}catch(e){}location.reload()}
function checkUpdate(manual){
  if(!swReg){if(manual)toast('Updates gehen nur, wenn die App über die Internetadresse geöffnet ist.');return}
  swReg.update().then(()=>{if(manual&&!swReg.installing&&!swReg.waiting)toast('Du hast die neueste Version ('+APP_VERSION+') ✓')}).catch(()=>{if(manual)toast('Keine Verbindung – später nochmal versuchen.')});
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;checkUpdate(false)}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCtrl)return; // erste Installation
    if(busyNow()){pendingReload=true;toast('Neue Version geladen – wird gleich aktiviert.',4000)} else doReload();
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(pendingReload)return doReload();checkUpdate(false)});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingReload&&!busyNow())doReload()},400));
}
try{if(sessionStorage.getItem('rf_updated')){sessionStorage.removeItem('rf_updated');setTimeout(()=>toast('App wurde aktualisiert ✓ (Version '+APP_VERSION+')'),800)}}catch(e){}
boot();
</script>
</body>
